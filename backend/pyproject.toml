[project]
name = "neuralverse-backend"
version = "0.1.0"
description = "NeuralVerse Backend & Integration Platform foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.128,<0.129",
  "opentelemetry-api>=1.38,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.38,<2",
  "opentelemetry-sdk>=1.38,<2",
  "psycopg[binary]>=3.3.4,<3.4",
  "pydantic>=2.12,<2.13",
  "pydantic-settings>=2.11,<2.12",
  "sqlalchemy>=2.0.51,<2.1",
  "structlog>=25.5,<25.6",
  "temporalio>=1.18,<1.19",
  "uvicorn[standard]>=0.40,<0.41",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<0.29",
  "mypy>=1.18,<1.19",
  "pytest>=8.4,<8.5",
  "pytest-asyncio>=1.2,<1.3",
  "ruff>=0.14,<0.15",
]

migration = [
  "alembic>=1.18.5,<1.19",
]

[build-system]
requires = ["hatchling>=1.27,<1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuralverse_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: requires an explicitly configured real PostgreSQL database",
  "migration: validates Alembic configuration or execution",
  "postgres: requires PostgreSQL 16 behavior",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.uv]
default-groups = ["dev"]

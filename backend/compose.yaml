services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${NEURALVERSE_POSTGRES_DATABASE:-neuralverse_backend_bip}
      POSTGRES_USER: ${NEURALVERSE_POSTGRES_USER:-neuralverse_bip}
      POSTGRES_PASSWORD: ${NEURALVERSE_POSTGRES_PASSWORD:-neuralverse_bip_dev_only}
    ports:
      - "127.0.0.1:${NEURALVERSE_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
